:root{
  --amethyst:#9B59B6; --bg:#934AB0; --navitem:#502464; --darkpurple:#8842A8;
  --turquoise:#1ABC9C; --emerald:#2ECC71; --peter:#3498DB; --asphalt:#34495E; --green:#16A085;
  --sunflower:#F1C40F; --belize:#2980B9; --wisteria:#8E44AD; --alizarin:#E74C3C;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{height:100%;background:#1b1022;overflow:hidden}
body{font-family:"MB",-apple-system,Helvetica,Arial,sans-serif;color:#fff;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input{font:inherit;-webkit-user-select:text;user-select:text}
/* The version switch above the app, outside it: 2014 or 2015. */
body{display:flex;flex-direction:column}
#ver{flex:none;display:flex;align-items:center;justify-content:center;gap:10px;padding:calc(var(--sat) + 6px) 12px 6px;background:#1b1022}
#ver .seg{display:flex;background:rgba(255,255,255,.12);border-radius:10px;padding:2px}
#ver button{min-width:84px;padding:6px 14px;border-radius:8px;font-size:15px;color:rgba(255,255,255,.75)}
#ver button.on{background:var(--amethyst);color:#fff;box-shadow:0 1px 4px rgba(0,0,0,.35)}
#ver .src{font-family:"MR";font-size:11px;color:rgba(255,255,255,.55)}
#ver .src a{color:inherit}
#phone{position:relative;width:100vw;flex:1;min-height:0;overflow:hidden;background:var(--amethyst);container-type:size;--sat:0px}
@media (max-width:420px){ #ver .src{display:none} }
/* Every screen at hand: a button beside the switch, a list over the side. */
#allbtn{padding:6px 12px;border-radius:10px;background:rgba(255,255,255,.12);font-size:15px;color:#fff}
#all{position:fixed;inset:0;z-index:200;display:none}
#all.open{display:block}
#all .shade{position:absolute;inset:0;background:rgba(0,0,0,.45)}
#all .pane{position:absolute;top:0;bottom:0;left:0;width:min(330px,88vw);background:#1b1022;overflow-y:auto;
  padding:calc(var(--sat) + 14px) 0 calc(var(--sab) + 20px);box-shadow:8px 0 30px rgba(0,0,0,.5);animation:slidein .22s ease-out}
@keyframes slidein{from{transform:translateX(-100%)}to{transform:none}}
#all h3{font-size:12px;letter-spacing:.12em;color:rgba(255,255,255,.5);padding:16px 18px 6px;font-weight:700}
#all a{display:block;padding:10px 18px;color:#fff;text-decoration:none;font-size:16px}
#all a small{font-family:"MR";color:rgba(255,255,255,.45);font-size:11px;margin-left:6px}
#all a.on{background:var(--amethyst)}
#all a:hover{background:rgba(255,255,255,.08)}
/* Wide enough: the list stays at the side, and a screen shows as soon as the pointer is on its name. */
@media (min-width:900px){
  #allbtn{display:none}
  #all{display:block;inset:0 auto 0 0;width:300px}
  #all .shade{display:none}
  #all .pane{width:300px;animation:none;box-shadow:none;border-right:1px solid rgba(255,255,255,.08)}
  body{padding-left:300px}
}
@media (min-width:700px) and (min-height:640px){
  body{align-items:center;justify-content:center;background:radial-gradient(circle at 50% 30%,#3a1f4a,#120a18)}
  #ver{background:none;padding:0 0 14px;flex-direction:column}
  #allbtn{position:fixed;left:24px;top:50%;transform:translateY(-50%);padding:14px 16px;font-size:16px}
  #phone{flex:none;width:390px;height:min(844px,calc(100vh - 110px));border-radius:54px;box-shadow:0 0 0 12px #0c0c0e,0 0 0 14px #444,0 30px 80px rgba(0,0,0,.6);--sat:44px;--sab:20px}
  #phone::before{content:"";position:absolute;z-index:99;top:10px;left:50%;transform:translateX(-50%);width:120px;height:32px;border-radius:20px;background:#000;pointer-events:none}
}
.screen{position:absolute;inset:0;overflow:hidden;background:var(--amethyst)}
.anim-push{animation:push .28s ease-out}
.anim-up{animation:up .32s cubic-bezier(.2,.8,.3,1)}
.anim-fade{animation:fade .25s ease-out}
@keyframes push{from{transform:translateX(30%);opacity:.3}to{transform:none;opacity:1}}
@keyframes up{from{transform:translateY(40%);opacity:0}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.scroll{overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.scroll::-webkit-scrollbar{display:none}

/* nav bar (YoNavigationController) */
.nav{position:relative;height:calc(44px + var(--sat));padding-top:var(--sat);display:flex;align-items:center;justify-content:space-between;padding-left:14px;padding-right:14px;flex:none}
.nav .t{position:absolute;left:70px;right:70px;text-align:center;font-size:19px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;bottom:11px}
.nav button{font-size:17px;color:var(--navitem);z-index:1;padding:8px 0;min-width:44px;text-align:left}
.nav button.r{text-align:right}
.nav.light button{color:#fff}
.col{display:flex;flex-direction:column;height:100%}
.grow{flex:1;min-height:0}

/* rows */
.row{height:89px;display:flex;align-items:center;justify-content:center;font-size:36px;letter-spacing:.3px;text-transform:uppercase;position:relative;cursor:pointer;overflow:hidden;padding:0 15px;text-align:center;line-height:1}
.row .nm{white-space:nowrap;overflow:hidden;text-overflow:clip;max-width:100%}
.row:active::after{content:"";position:absolute;inset:0;background:rgba(255,255,255,.14)}
.row .st{position:absolute;bottom:8px;left:15px;right:15px;font-family:"MR";font-size:11px;text-transform:none;opacity:.95}
.row .ph{font-size:30px;text-transform:none}
.tblsep .row{border-bottom:.5px solid rgba(255,255,255,.3)}
.glow .row .nm,.glow .row .ph{text-shadow:0 0 2px #000,0 0 2px #000,0 0 4px #000}

/* spinner (UIActivityIndicatorViewStyleWhiteLarge) */
.spin{width:37px;height:37px;animation:spin .8s steps(12) infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* main */
#ctxs{position:absolute;inset:0;display:flex;cursor:grab;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none}
#ctxs::-webkit-scrollbar{display:none}
.ctx{flex:none;width:100%;height:100%;position:relative;scroll-snap-align:start;scroll-snap-stop:always;overflow:hidden}
.ctx .bgv{position:absolute;inset:0}
.ctx .tbl{position:absolute;inset:0;padding-top:calc(30px + var(--sat));padding-bottom:140px}
.statusbar{position:absolute;left:0;right:0;top:0;height:calc(30px + var(--sat));padding-top:var(--sat);display:flex;align-items:center;justify-content:center;z-index:5;pointer-events:none;background:linear-gradient(rgba(0,0,0,.18),rgba(0,0,0,0))}
.statusbar .lbl{position:absolute;left:0;right:0;text-align:center;font-size:14px;opacity:0;transition:opacity .2s;text-shadow:0 1px 2px rgba(0,0,0,.4)}
.statusbar .dots{display:flex;gap:9px;transition:opacity .2s;pointer-events:auto}
.statusbar .dots i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.35);cursor:pointer}
.statusbar .dots i.on{background:#fff}
.uparrow{position:absolute;top:calc(var(--sat) + 7px);left:50%;transform:translateX(-50%);width:29px;opacity:0;z-index:6;filter:invert(1);pointer-events:none}
.plusc{position:absolute;right:-45px;bottom:-45px;width:150px;height:150px;border-radius:50%;background:rgba(255,255,255,.2);box-shadow:-3px -3px 5px #000;z-index:6;cursor:pointer}
.plusc img{position:absolute;left:36px;top:36px;width:30px;height:30px}
.inboxbtn{position:absolute;left:20px;bottom:calc(20px + var(--sab));width:61px;height:61px;border-radius:50%;background:var(--alizarin);box-shadow:0 3px 3px rgba(0,0,0,.5);font-size:24px;z-index:6;display:none}
.utilbtn{position:absolute;left:20px;bottom:calc(20px + var(--sab));width:65px;height:65px;border-radius:50%;background:rgba(0,0,0,.2);box-shadow:0 0 3px rgba(0,0,0,.5);font-size:28px;z-index:4;display:flex;align-items:center;justify-content:center;transition:left .2s}
.has-inbox .utilbtn{left:101px}
.bigemoji{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:105px;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
.pickgrid{position:absolute;inset:0;background:var(--bg);z-index:30;display:flex;flex-direction:column;padding-top:var(--sat)}
.pickgrid h3{text-align:center;font-size:22px;margin:20px 0 10px}
.pickgrid .g{flex:1;display:grid;grid-template-columns:repeat(5,1fr);align-items:center;justify-items:center}
.pickgrid .g button{font-size:44px;width:100%;height:100%;font-family:"MB","Apple Color Emoji",sans-serif}
.pickgrid .cancel{align-self:center;margin:12px 0 calc(20px + var(--sab));width:130px;height:65px;border-radius:33px;background:rgba(0,0,0,.2);font-size:19px}

/* banner (in-app Yo notification) */
.banner{position:absolute;left:0;right:0;top:0;z-index:80;background:var(--peter);padding:calc(var(--sat) + 14px) 16px 14px;box-shadow:0 3px 8px rgba(52,73,94,.7);font-size:18px;text-align:center;transform:translateY(-110%);transition:transform .35s cubic-bezier(.2,.8,.3,1);cursor:pointer}
.banner.show{transform:none}
/* while a banner is down, the screen under it moves down by its height: it covers no row */
.scroll{transition:transform .35s cubic-bezier(.2,.8,.3,1)}
.bannered .scroll{transform:translateY(var(--banner,0px))}

/* YoAlert */
.veil{position:absolute;inset:0;background:rgba(0,0,0,.5);z-index:90;display:flex;align-items:center;justify-content:center;animation:fade .2s}
.yoalert{width:84%;max-width:330px;background:var(--bg);border-radius:10px;overflow:hidden;animation:pop .25s ease-out}
@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:none;opacity:1}}
.yoalert .h{font-size:22px;text-align:center;padding:16px 40px 12px;position:relative}
.yoalert .h .x{position:absolute;right:10px;top:10px;font-size:20px;opacity:.8}
.yoalert .h img{display:block;margin:0 auto 6px;width:58px}
.yoalert .d{background:rgba(0,0,0,.14);padding:18px 18px;font-family:"MR";font-size:18px;text-align:center;line-height:1.3;white-space:pre-line}
.yoalert .d b{font-family:"MB";font-size:20px}
.yoalert .bs{display:flex}
.yoalert .bs button{flex:1;height:56px;font-size:20px}

/* action sheet (UIActionSheet iOS 8) */
.sheetwrap{position:absolute;inset:0;z-index:90;background:rgba(0,0,0,.4);display:flex;flex-direction:column;justify-content:flex-end;padding:0 8px calc(8px + var(--sab));animation:fade .2s}
.sheet{animation:up .25s ease-out}
.sheet .grp{background:rgba(248,248,248,.96);border-radius:13px;overflow:hidden;margin-bottom:8px}
.sheet .ttl{font-family:-apple-system,Helvetica,sans-serif;font-size:13px;color:#8f8f8f;text-align:center;padding:14px 16px;border-bottom:.5px solid #ccc;white-space:pre-line}
.sheet button{display:block;width:100%;height:57px;font-family:-apple-system,Helvetica,sans-serif;font-size:20px;color:#007aff;border-bottom:.5px solid #ccc}
.sheet button:last-child{border-bottom:0}
.sheet button.destr{color:#ff3b30}
.sheet button.cancel{font-weight:600}

/* menu */
.menu .profile{height:175px;position:relative;text-align:center;flex:none;cursor:pointer}
.menu .profile img{width:59px;height:59px;border-radius:7px;border:2px solid var(--darkpurple);background:rgba(255,255,255,.15);position:absolute;left:50%;top:-29px;transform:translateX(-50%)}
.menu .profile .n{position:absolute;top:44px;left:10px;right:10px;font-size:22px}
.menu .profile .u{position:absolute;top:81px;left:10px;right:10px;font-size:16px}
.menu .profile .c{position:absolute;top:111px;left:10px;right:10px;font-family:"MR";font-size:17px}
.menu .mrow{height:calc(100cqh * 2 / 18);display:flex;align-items:center;justify-content:center;font-size:31px;border-top:1px solid var(--darkpurple);cursor:pointer;background:var(--bg)}
.menu .mrow:active{background:#8a40a8}
.menu .dbl{display:flex;height:calc(100cqh * 2 / 18);border-top:1px solid var(--darkpurple);animation:push .25s}
.menu .dbl button{flex:1;font-size:26px}
.menu .dbl button:first-child{background:var(--emerald)}
.menu .dbl button:last-child{background:var(--peter)}
.menu .footer{position:absolute;left:0;right:0;bottom:0;height:calc(100cqh * 3 / 36 + var(--sab));padding-bottom:var(--sab);background:rgba(147,74,176,.8);display:flex;align-items:center;justify-content:center;cursor:pointer}
.menu .footer img{width:28px;filter:invert(1)}

/* card (blurred background presentation) */
.cardwrap{position:absolute;inset:0;background:rgba(40,10,55,.55);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;padding:calc(var(--sat) + 10px) 14px calc(var(--sab) + 10px)}
.card{width:100%;max-height:100%;background:var(--bg);border-radius:10px;overflow:hidden;display:flex;flex-direction:column;animation:up .3s cubic-bezier(.2,.8,.3,1)}
.card .ch{height:52px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;font-size:17px;flex:none;position:relative}
.card .ch .t{position:absolute;left:60px;right:60px;text-align:center;font-size:20px}
.card .ch button{color:#fff;font-size:17px;z-index:1}
.fld{display:block;width:100%;height:52px;border:0;border-top:1px solid var(--darkpurple);background:rgba(0,0,0,.14);color:#fff;padding:0 16px;font-family:"MB";font-size:18px;outline:0;text-align:center}
.fld::placeholder{color:rgba(255,255,255,.55)}
.btn{display:block;width:100%;height:56px;font-size:20px;border-top:1px solid var(--darkpurple)}
.small{font-family:"MR";font-size:14px;opacity:.85}
.pad{padding:16px}
.center{text-align:center}

/* about */
.about{background:var(--amethyst);text-align:center}
.about .logo{font-size:110px;line-height:1;margin-top:calc(var(--sat) + 26px)}
.about .tag{font-size:17px;margin-top:4px}
.about .lst{margin-top:22px}
.about .lst .row{height:72px;font-size:26px}
.about .note{font-family:"MR";font-size:11px;opacity:.75;padding:14px 18px calc(14px + var(--sab));line-height:1.45}
.about .note a{color:#fff}

/* welcome */
.wel .pages{position:absolute;left:0;right:0;top:0;bottom:calc(190px + var(--sab));display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.wel .pages::-webkit-scrollbar{display:none}
.wel .pg{flex:none;width:100%;height:100%;scroll-snap-align:start;display:flex;flex-direction:column;align-items:center;justify-content:center;padding-top:var(--sat)}
.wel .pg img{max-width:78%;max-height:92%;object-fit:contain}
.wel .bottom{position:absolute;left:0;right:0;bottom:0;padding:0 24px calc(18px + var(--sab))}
.wel .dots{display:flex;gap:9px;justify-content:center;margin-bottom:16px}
.wel .dots i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.35)}
.wel .dots i.on{background:#fff}
.wel .b{display:block;width:100%;height:48px;border-radius:4px;font-size:18px;margin-top:9px}

/* inbox */
.inbox .nav{background:var(--emerald)}
.icell{display:flex;align-items:center;gap:14px;padding:14px 16px;border-bottom:.5px solid rgba(255,255,255,.35);cursor:pointer}
.icell img{width:42px;height:42px;border-radius:8px;flex:none}
.icell .s{font-size:17px}
.icell .d{font-family:"MR";font-size:14px;margin-top:3px;opacity:.9}

/* store */
.cats{display:flex;gap:6px;overflow-x:auto;padding:8px 10px;flex:none;scrollbar-width:none}
.cats button{font-size:12px;padding:7px 10px;border-radius:14px;background:rgba(0,0,0,.18);white-space:nowrap}
.cats button.on{background:#fff;color:var(--bg)}
.sitem{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:.5px solid rgba(255,255,255,.3);cursor:pointer}
.sitem .ic{width:50px;height:50px;border-radius:11px;flex:none;display:flex;align-items:center;justify-content:center;font-size:18px}
.sitem .tx{flex:1;min-width:0}
.sitem .tx b{display:block;font-size:15px;font-weight:400;overflow:hidden;text-overflow:ellipsis}
.sitem .tx span{display:block;font-family:"MR";font-size:12px;opacity:.9;margin-top:2px}
.subbtn{font-size:12px;padding:7px 10px;border:1.5px solid #fff;border-radius:5px;flex:none}
.subbtn.on{background:#fff;color:var(--bg)}
.tabbar{display:flex;height:calc(50px + var(--sab));padding-bottom:var(--sab);background:rgba(0,0,0,.2);flex:none}
.tabbar button{flex:1;font-size:13px;opacity:.6}
.tabbar button.on{opacity:1}

/* web browser */
.browser .bar{background:#f7f7f7;color:#333;font-family:-apple-system,Helvetica,sans-serif;font-size:14px;padding:calc(var(--sat) + 6px) 10px 8px;display:flex;align-items:center;gap:8px}
.browser .bar .u{flex:1;background:#e6e6e8;border-radius:8px;padding:7px 10px;text-align:center;color:#555}
.browser .bar button{color:#007aff;font-size:16px}
.browser .tool{background:#f7f7f7;height:calc(44px + var(--sab));padding-bottom:var(--sab);display:flex;justify-content:space-around;align-items:center;color:#007aff;font-size:22px;border-top:.5px solid #ccc}
.browser .page{background:#fff;color:#333;font-family:-apple-system,Helvetica,sans-serif}

/* classic 2014 */
.classic .row{font-size:38px}
.redbtn{position:absolute;right:18px;bottom:calc(18px + var(--sab));width:62px;height:62px;border-radius:50%;background:var(--alizarin);display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(0,0,0,.35);z-index:6}
.redbtn svg{width:30px;height:30px}
.crow-input{width:100%;background:transparent;border:0;outline:0;color:#fff;text-align:center;font-family:"MB";font-size:30px;text-transform:uppercase}
.crow-input::placeholder{color:rgba(255,255,255,.75)}

/* lock screen */
.lock{background:linear-gradient(160deg,#4a2363,#2b1238 60%,#3d1c50);text-align:center;font-family:-apple-system,"Helvetica Neue",Helvetica,sans-serif;font-weight:200}
.lock .time{font-size:84px;margin-top:calc(var(--sat) + 40px);letter-spacing:-2px}
.lock .date{font-size:19px;font-weight:400}
.lock .noti{margin:40px 14px 0;background:rgba(255,255,255,.2);border-radius:14px;padding:12px 14px;text-align:left;display:flex;gap:10px;align-items:center;font-weight:400;cursor:pointer}
.lock .noti img{width:36px;height:36px;border-radius:8px}
.lock .slide{position:absolute;left:0;right:0;bottom:calc(40px + var(--sab));font-size:22px;font-weight:300;opacity:.85;cursor:pointer}

.hint{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(100px + var(--sab));background:rgba(0,0,0,.55);padding:8px 14px;border-radius:16px;font-family:"MR";font-size:13px;z-index:7;white-space:nowrap;animation:fade .3s;pointer-events:none}
.tip{position:absolute;left:12px;right:12px;bottom:calc(110px + var(--sab));z-index:70;background:var(--peter);border-radius:8px;padding:14px;font-size:16px;text-align:center;box-shadow:0 3px 8px rgba(52,73,94,.7);animation:up .3s}
</style>

function yoAlert({title, desc, html, img, buttons=[{t:'OK'}], close=false}) {

  const multi = buttons.length > 1;
  v.innerHTML = `<div class="yoalert"><div class="h">${img?`<img src="${img}">`:''}${esc(title)}${close?'<button class="x">✕</button>':''}</div>

    const b = e.target.closest('button');
    if (b && b.dataset.i!=null){ v.remove(); const f = buttons[+b.dataset.i].f; f && f(); }

  });

function actionSheet({title, destructive, others=[], cancel='Cancel', onCancel}) {
  const w = document.createElement('div'); w.className='sheetwrap';
  const btns = [];
  if (destructive) btns.push({t:destructive.t, f:destructive.f, cls:'destr'});
  others.forEach(o=>btns.push(o));
  w.innerHTML = `<div class="sheet"><div class="grp">${title?`<div class="ttl">${esc(title)}</div>`:''}${btns.map((b,i)=>`<button data-i="${i}" class="${b.cls||''}">${esc(b.t)}</button>`).join('')}</div>
    <div class="grp"><button class="cancel" data-c>${esc(cancel)}</button></div></div>`;
  w.addEventListener('click', e=>{

  });
  phone.appendChild(w);
}

let curRoute = null, prevRoute = null;
function route(){ return decodeURIComponent(location.hash.replace(/^#/, '')) || 'main'; }
function go(r){ if (location.hash === '#'+r) render(); else location.hash = r; }
function back(){
  const r = route(); const base = r.split('/')[0];
  let p = PARENT[base]; if (p === undefined) p = route().startsWith('classic') ? 'classic' : 'main';
  if (base==='mail' && r.split('/')[1]==='classic') p='classic-menu';
  location.replace('#'+(p||base));
}
window.addEventListener('hashchange', render);
function render(){
  const r = route(); const [base, arg] = r.split('/');
  const fn = SCREENS[base] || SCREENS.main;
  const classic = base.startsWith('classic') || (base==='mail' && arg==='classic');
  document.querySelectorAll('#ver button').forEach(b=>b.classList.toggle('on', (b.dataset.v==='classic')===classic));
  document.querySelectorAll('.veil,.sheetwrap,.tip,.pickgrid').forEach(n=>n.remove());
  stopMainTimers();
  const depthUp = prevRoute && (PARENT[base]===prevRoute.split('/')[0]);
  const html = fn(arg);
  root.innerHTML = '';
  const s = document.createElement('div');
  s.className = 'screen ' + (depthUp ? (CARD.has(base)?'anim-up':'anim-push') : 'anim-fade');
  s.innerHTML = html; root.appendChild(s);
  (AFTER[base]||(()=>{}))(s, arg);
  prevRoute = r;
}

  $('#sbdots', s).addEventListener('click', e=>{ const d=e.target.closest('i'); if(!d) return; sc.scrollTo({left:+d.dataset.i*sc.clientWidth, behavior:'smooth'}); });
  // keep all tables at the same vertical offset (scrollViewDidScroll)
  s.querySelectorAll('.tbl').forEach(t=>t.addEventListener('scroll', ()=>{ if (t.scrollTop>=0) s.querySelectorAll('.tbl').forEach(o=>{ if(o!==t && Math.abs(o.scrollTop-t.scrollTop)>1) o.scrollTop=t.scrollTop; }); }));
  wireRows(s); wirePull(s);
  // A presentation: the contexts go on by themselves every 3 s, after the last one back to the first; a touch, a
  // drag, a key or a tap pauses that for 8 s.
  let handsOn = 0;
  ['pointerdown','wheel','keydown'].forEach(t=>s.addEventListener(t, ()=>{ handsOn=Date.now(); }, {passive:true}));
  document.addEventListener('keydown', ()=>{ handsOn=Date.now(); });
  mainTimers.push(setInterval(()=>{
    if (Date.now()-handsOn < 8000 || document.querySelector('.veil,.sheetwrap,.pickgrid')) return;
    const next = (ctxIndex+1) % CONTEXTS.length;
    sc.scrollTo({left: next*sc.clientWidth, behavior: next ? 'smooth' : 'instant'});
  }, 3000));
  // statuses: showLastYoStatus after a while
  mainTimers.push(setTimeout(()=>s.querySelectorAll('.st').forEach(x=>{x.hidden=false;}), 1800));
  // fake incoming Yos now and then
  const first = setTimeout(incoming, 7000); mainTimers.push(first);
  const iv = setInterval(()=>{ if (Math.random()<.6) incoming(); }, 30000); mainTimers.push(iv);
};

let firstYoShown = false;
function wireRows(s){
  s.addEventListener('pointerdown', e=>{
    const row = e.target.closest('.row[data-u]'); if (!row) return;
    let moved=false, long=false; const x0=e.clientX, y0=e.clientY;
    const lt = setTimeout(()=>{ long=true; const f=friends.find(f=>f.u===row.dataset.u); go((f.group?'group/':'profile/')+f.u); }, 500); // UILongPressGestureRecognizer 0.5s
    const mv = ev=>{ if (Math.abs(ev.clientX-x0)>8||Math.abs(ev.clientY-y0)>8){ moved=true; clearTimeout(lt);} };
    const up = ()=>{ clearTimeout(lt); row.removeEventListener('pointermove',mv); document.removeEventListener('pointerup',up); document.removeEventListener('pointercancel',up);
      if (!moved && !long) sendYo(row); };
    row.addEventListener('pointermove',mv); document.addEventListener('pointerup',up); document.addEventListener('pointercancel',up);
  });
  s.addEventListener('contextmenu', e=>e.preventDefault());
}
function sendYo(row){
  if (row.dataset.busy) return; row.dataset.busy='1';
  const ctx = CONTEXTS[ctxIndex]; const u=row.dataset.u;
  const nm=row.querySelector('.nm'), st=row.querySelector('.st');
  const keep = nm.outerHTML; nm.outerHTML = `<span class="nm">${SPIN}</span>`; st && (st.style.visibility='hidden');
  // startAnimatingActivityIndicator -> API -> showMessage:textForSentYo forDuration:1.5
  setTimeout(()=>{
    let sent = ctx.sent;
    if (ctx.id==='emoji') sent = 'Sent Emoji '+emoji;
    if (ctx.id==='yo_plus_emoji' && plusEmoji!=='Yo') sent = 'Sent '+plusEmoji+'!';
    const f = friends.find(f=>f.u===u);
    if (f && f.group) sent = sent; // groups use the same text
    row.querySelector('.nm').outerHTML = `<span class="nm ph">${esc(sent)}</span>`;
    setTimeout(()=>{
      // promoteContactToTop
      const i = friends.findIndex(x=>x.u===u); const [it] = friends.splice(i,1); it.status='Sent Just now'; friends.unshift(it);
      document.querySelectorAll('.ctx').forEach((p,k)=>{ p.querySelector('.tbl').innerHTML = userRows(CONTEXTS[k]); });
      document.querySelectorAll('.st').forEach(x=>x.hidden=false);
      if (!firstYoShown){ firstYoShown=true; setTimeout(firstYoAlert, 250); }
      else setTimeout(()=>showTip(f&&f.group?'TAP AND HOLD to edit or mute a group':'TAP AND HOLD to see a profile'), 500);
    }, 1500);
  }, 700);
}
function firstYoAlert(){
  const ctx=CONTEXTS[ctxIndex];
  const first = {location:'📍 Yo Location', camera:'📷 Yo Photo', last_photo:'📷 Yo Photo', video:'📹 Yo Video', emoji:emoji+' Yo', gif:'📷 Yo Gif', web:'🔗 Yo Link', audio:'🎤 Yo Voice'}[ctx.id] || 'Yo';
  yoAlert({title:'First Yo Sent!', img:IMG.yo_icon_filled,

    buttons:[{t:'Enable Notifications', f:()=>sound('yo')}]});
}
function wirePull(s){
  // pull the list down more than 80pt -> presentMenuConroller
  s.querySelectorAll('.tbl').forEach(t=>{
    let y0=null, pulled=0;
    t.addEventListener('touchstart', e=>{ y0 = t.scrollTop<=0 ? e.touches[0].clientY : null; pulled=0; }, {passive:true});
    t.addEventListener('touchmove', e=>{ if (y0==null) return; pulled = e.touches[0].clientY - y0; if (pulled>0){ t.style.transform=`translateY(${Math.min(pulled*.5,90)}px)`; const a=$('#uparrow'); a&&(a.style.opacity=Math.min(pulled/160,1)); if (pulled>160){ y0=null; t.style.transform=''; go('menu'); } } }, {passive:true});
    t.addEventListener('touchend', ()=>{ t.style.transition='transform .2s'; t.style.transform=''; setTimeout(()=>t.style.transition='',220); const a=$('#uparrow'); a&&(a.style.opacity=0); y0=null; });
    // mouse
    t.addEventListener('mousedown', e=>{ if (t.scrollTop>0) return; const my0=e.clientY;
      const mm = ev=>{ const d=ev.clientY-my0; if (d>0){ t.style.transform=`translateY(${Math.min(d*.5,90)}px)`; const a=$('#uparrow'); a&&(a.style.opacity=Math.min(d/160,1)); } if (d>160){ cleanup(); go('menu'); } };
      const cleanup = ()=>{ document.removeEventListener('mousemove',mm); document.removeEventListener('mouseup',cleanup); t.style.transform=''; const a=$('#uparrow'); a&&(a.style.opacity=0); };
      document.addEventListener('mousemove',mm); document.addEventListener('mouseup',cleanup); });
    t.addEventListener('wheel', e=>{ if (t.scrollTop<=0 && e.deltaY < -60) go('menu'); }, {passive:true});
  });
}

document.addEventListener('keydown', e=>{
  if (e.target.tagName==='INPUT') return;
  if (e.key==='Escape' || e.key==='Backspace') back();
  if (route().startsWith('main')) { const sc=$('#ctxs'); if(!sc) return;
    if (e.key==='ArrowRight') sc.scrollTo({left:Math.min(ctxIndex+1,CONTEXTS.length-1)*sc.clientWidth,behavior:'smooth'});
    if (e.key==='ArrowLeft') sc.scrollTo({left:Math.max(ctxIndex-1,0)*sc.clientWidth,behavior:'smooth'});
    if (e.key==='ArrowDown') go('menu'); }
});
// Mouse (desktop): drag sideways to swipe the contexts or the welcome's slides, as a finger does (touch scrolls by
// itself, a trackpad too). A drag never sends a Yo: the rows send only when the pointer did not move.
document.addEventListener('pointerdown', e=>{
  if (e.pointerType!=='mouse' || e.button!==0) return;
  const sc = e.target.closest('#ctxs, .wel .pages'); if (!sc) return;
  const x0=e.clientX, left0=sc.scrollLeft, w=sc.clientWidth;
  sc.style.scrollSnapType='none'; sc.style.cursor='grabbing';
  const mv = ev=>{ sc.scrollLeft = left0-(ev.clientX-x0); };
  const up = ev=>{
    document.removeEventListener('pointermove',mv); document.removeEventListener('pointerup',up);
    const dx=ev.clientX-x0, last=Math.round(sc.scrollWidth/w)-1;
    const page=Math.max(0,Math.min(Math.round(left0/w)+(dx<-40?1:dx>40?-1:0),last));
    sc.style.cursor='';
    sc.scrollTo({left:page*w,behavior:'smooth'});
    setTimeout(()=>{ sc.style.scrollSnapType=''; }, 450);
  };
  document.addEventListener('pointermove',mv); document.addEventListener('pointerup',up);
});

})();

const ALL = [
  ['2015 · Start', [['Welcome slides','welcome'],['Sign up','signup'],['Log in','login'],['Recover','recover'],['Verify phone','verify'],['Code','code'],['Allow push','enable-push'],['Allow location','enable-location'],['Lock screen','lock']]],
  ['2015 · The list, by context', CONTEXTS.map(c=>[({location:'📍 Location', just_yo:'Just Yo', camera:'📷 Camera', last_photo:'🖼️ Last photo', video:'📹 Video', emoji:'😁 Emoji', yo_plus_emoji:'Yo + emoji', gif:'GIF', web:'🔗 Link', audio:'🎤 Audio', clipboard:'📋 Clipboard'})[c.id] || c.title, 'main/'+c.id])],
  ['2015 · A friend', [['Profile','profile/LEO'],['Group','group/FAMILY']]],
  ['2015 · Inbox', [['Inbox','inbox'],['An opened Yo','yo/0'],['An opened Yo (location)','yo/1']]],
  ['2015 · Adding (+)', [['Add …','add'],['Add a friend','add-friend'],['Create a group','create-group'],['Add members','add-members'],['Yo Store','store'],['A store item','store-item/RAINHOUR']]],
  ['2015 · Menu', [['Menu','menu'],['Feedback','menu/feedback'],['Invite','invite'],['Unblock','unblock'],['FAQ','faq'],['Edit profile','edit-profile'],['Mail','mail'],['Mail: improve','mail/improve'],['Pick Yo types (beta)','pick-types']]],
  ['2014 · Classic', [['The list','classic'],['Menu','classic-menu'],['Invite','classic-invite'],['Find friends','classic-find'],['Yo Index','classic-index'],['Edit profile','classic-edit'],['What is Yo?','classic-what'],['Unblock','classic-unblock'],['Mail','mail/classic']]],
];
const allBox = document.getElementById('all'), allPane = allBox.querySelector('.pane');
const wide = matchMedia('(min-width:900px)');
// The list of the version on show only: 2014's screens with 2014, 2015's with 2015.
let listed = null;
function markAll(){
  const now = location.hash.replace(/^#/,'') || 'main';
  const year = now.startsWith('classic') || now === 'mail/classic' ? '2014' : '2015';
  if (listed !== year) {
    listed = year;
    allPane.innerHTML = ALL.filter(([title]) => title.startsWith(year)).map(([title, items]) =>
      `<h3>${title.replace(/^\d+ · /, '').toUpperCase()}</h3>` +
      items.map(([name, hash]) => `<a href="#${hash}" data-h="${hash}">${esc(name)}<small>#${hash}</small></a>`).join('')).join('');
  }
  allPane.querySelectorAll('a').forEach(a => a.classList.toggle('on', a.dataset.h === now));
}
window.addEventListener('hashchange', markAll); markAll();
function openAll(){ markAll(); allBox.classList.add('open'); }
// Hover shows the screen at once (in place, no history entry per name passed over); a click keeps it.
allPane.addEventListener('mouseover', e => {
  const a = e.target.closest('a'); if (!a || !wide.matches) return;
  if (location.hash !== '#'+a.dataset.h) location.replace('#'+a.dataset.h);
});
document.getElementById('allbtn').addEventListener('click', openAll);
allBox.addEventListener('click', e => { if ((e.target.closest('a') && !wide.matches) || e.target.classList.contains('shade')) allBox.classList.remove('open'); });
document.addEventListener('keydown', e => { if (e.key==='Escape' && allBox.classList.contains('open')) { e.stopImmediatePropagation(); allBox.classList.remove('open'); } }, true);
</script>
</body>
</html>
